  <text x="190" y="96" font-family="'Manrope', 'Inter', sans-serif" font-size="18" font-weight="800" fill="#22c55e" text-anchor="middle" letter-spacing="2">ZENBUDGET AI</text>

  <!-- Visual Headline -->
